<html ><head>
 <title>Registration Form</title>
 <link rel="stylesheet" href="style.css">
</head>
<body> <div class="container">
 <h2>Registration Form</h2>
 <form id="registrationForm">
 <div class="form-group">
 <label for="name">Name:</label>
 <input type="text" id="name" name="name" required>
 <span class="error" id="nameError"></span> </div>
 <div class="form-group">
 <label for="email">Email:</label>
 <input type="email" id="email" name="email" required>
 <span class="error" id="emailError"></span> </div>
 <div class="form-group">
 <label for="phone">Phone Number:</label>
 <input type="text" id="phone" name="phone" required>
 <span class="error" id="phoneError"></span> </div>
 <div class="form-group">
 <label for="password">Password:</label>
 <input type="password" id="password" name="password" required>
 <span class="error" id="passwordError"></span> </div>
 <button type="submit">Register</button> </form> </div>
 <script src="script.js"></script></body></h
